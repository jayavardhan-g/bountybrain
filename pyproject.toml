[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bountybrain"
version = "1.0.0"
description = "A knowledge graph and retrieval system for learning bug bounty hunting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jayavardhan" }]
keywords = ["security", "knowledge-graph", "rag", "cwe", "capec", "bug-bounty"]

[project.urls]
Homepage = "https://github.com/jayavardhan-g/bountybrain"

[tool.setuptools.packages.find]
include = ["bountybrain*"]

[tool.setuptools.package-data]
bountybrain = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length — the formatter's judgement, not the linter's
    # Typer declares CLI arguments as `x: T = typer.Option(...)`. That is the
    # framework's documented idiom, not the mutable-default bug B008 targets.
    "B008",
]
