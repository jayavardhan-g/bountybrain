services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bountybrain
      POSTGRES_USER: bountybrain
      POSTGRES_PASSWORD: bountybrain
    ports:
      - "5432:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bountybrain"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://bountybrain:bountybrain@postgres:5432/bountybrain
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    env_file: .env
    environment:
      BOUNTYBRAIN_API: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"
