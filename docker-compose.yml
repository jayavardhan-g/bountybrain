# Optional containerised stack.
#
# The default local setup needs none of this: the graph lives in SQLite and
# Qdrant runs embedded, so `python build_graph.py && streamlit run ...` works
# with nothing else running. This compose file is for when you want the
# services standalone — a shared instance, or concurrent writers.
#
# The LLM is deliberately not containerised: it needs a GPU and a ~28 GB model,
# and `python serve_llm.py` on the host is simpler than plumbing that through
# Docker. Point VLLM_BASE_URL at wherever it runs.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bountybrain
      POSTGRES_USER: bountybrain
      POSTGRES_PASSWORD: bountybrain
    ports:
      - "5432:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bountybrain"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant-server:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://bountybrain:bountybrain@postgres:5432/bountybrain
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://bountybrain:bountybrain@postgres:5432/bountybrain
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
